<!-- The poster is the whole page, so fetch it as early as possible -->

<style>
  html, body { margin: 0; padding: 0; background: #e8e4df; }
  body { -webkit-font-smoothing: antialiased; }
  a { color: #2b2724; text-decoration: none; }
  a:hover { color: #000000; }

  @keyframes riseIn {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .poster, .link-btn { animation: none !important; }
  }

  .stage {
    min-height: 100svh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(120% 90% at 50% 40%, #efece7 0%, #e5e0da 70%, #d9d3cc 100%);
    padding: 0;
    overflow: hidden;
  }

  .poster {
    position: relative;
    width: min(100vw, calc(100svh * 0.6667));
    aspect-ratio: 1024 / 1536;
    background-image: url('assets/poster.jpg');   /* fallback for no image-set() */
    background-image: -webkit-image-set(url('assets/poster.webp') type('image/webp'),
                                        url('assets/poster.jpg')  type('image/jpeg'));
    background-image: image-set(url('assets/poster.webp') type('image/webp'),
                                url('assets/poster.jpg')  type('image/jpeg'));
    background-size: 100% 100%;
    background-repeat: no-repeat;
    box-shadow: 0 40px 90px -30px rgba(60, 48, 38, 0.45);
    animation: fadeIn 700ms ease both;
  }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    margin: 0;
  }

  .link-btn {
    position: absolute;
    left: 30.566%;
    width: 39.0625%;
    height: 4.883%;
    display: block;
    border-radius: 999px;
    overflow: hidden;
    transition: transform 260ms cubic-bezier(.2, .8, .2, 1), box-shadow 260ms ease, filter 260ms ease;
    box-shadow: 0 6px 18px -8px rgba(40, 30, 22, 0.45);
    will-change: transform;
  }
  .link-btn picture {
    display: block;
    width: 100%;
    height: 100%;
  }
  .link-btn img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: fill;
  }
  .link-btn:focus-visible {
    outline: 2px solid #2b2724;
    outline-offset: 3px;
  }
  .link-btn:hover {
    transform: translateY(-3px) scale(1.018);
    box-shadow: 0 16px 34px -12px rgba(40, 30, 22, 0.55);
    filter: brightness(1.03);
  }
  .link-btn:active {
    transform: translateY(-1px) scale(0.997);
    box-shadow: 0 6px 14px -8px rgba(40, 30, 22, 0.5);
  }

  .link-btn--instagram { top: 45.052%; animation: riseIn 620ms cubic-bezier(.2, .8, .2, 1) 120ms both; }
  .link-btn--youtube   { top: 50.586%; animation: riseIn 620ms cubic-bezier(.2, .8, .2, 1) 210ms both; }
  .link-btn--whatsapp  { top: 56.120%; animation: riseIn 620ms cubic-bezier(.2, .8, .2, 1) 300ms both; }
  .link-btn--facebook  { top: 61.654%; animation: riseIn 620ms cubic-bezier(.2, .8, .2, 1) 390ms both; }

</style>
</head>
<body>
  <div class="stage">
    <div class="poster">
      <h1 class="visually-hidden">Saptadeep Sarma — Photographer / Filmmaker / Spiritual Scientist / Entrepreneur</h1>

      <a class="link-btn link-btn--instagram" href="https://www.instagram.com/self_made_billionare_monk?igsi=MWE0NnRrc3h6eHl5eQ%3D%3D" target="_blank" rel="noopener" aria-label="Instagram — photos &amp; moments">
        <picture>
          <source srcset="assets/btn-1.webp" type="image/webp">
          <img src="assets/btn-1.jpg" alt="Instagram" decoding="async">
        </picture>
      </a>

      <a class="link-btn link-btn--youtube" href="https://youtube.com/@saptadeepsarma8943" target="_blank" rel="noopener" aria-label="YouTube — films &amp; stories">
        <picture>
          <source srcset="assets/btn-2.webp" type="image/webp">
          <img src="assets/btn-2.jpg" alt="YouTube" decoding="async">
        </picture>
      </a>

      <a class="link-btn link-btn--whatsapp" href="https://wa.me/918974151996" target="_blank" rel="noopener" aria-label="WhatsApp — message directly">
        <picture>
          <source srcset="assets/btn-3.webp" type="image/webp">
          <img src="assets/btn-3.jpg" alt="WhatsApp" decoding="async">
        </picture>
      </a>

      <a class="link-btn link-btn--facebook" href="https://www.facebook.com/share/1W4mgRKcbk/" target="_blank" rel="noopener" aria-label="Facebook — follow along">
        <picture>
          <source srcset="assets/btn-4.webp" type="image/webp">
          <img src="assets/btn-4.jpg" alt="Facebook" decoding="async">
        </picture>
      </a>
    </div>
  </div>
</body>
</html>
