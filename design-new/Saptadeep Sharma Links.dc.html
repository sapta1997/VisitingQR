<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  html, body { margin: 0; padding: 0; background: #e8e4df; }
  body { -webkit-font-smoothing: antialiased; }
  a { color: #2b2724; text-decoration: none; }
  a:hover { color: #000000; }
  @keyframes riseIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</helmet>
<div style="min-height: 100svh; width: 100%; display: flex; align-items: center; justify-content: center; background: radial-gradient(120% 90% at 50% 40%, #efece7 0%, #e5e0da 70%, #d9d3cc 100%); padding: 0; overflow: hidden;">
  <div style="position: relative; width: min(100vw, calc(100svh * 0.6667)); aspect-ratio: 1024 / 1536; background-image: url('assets/poster-clean.png'); background-size: 100% 100%; background-repeat: no-repeat; box-shadow: 0 40px 90px -30px rgba(60,48,38,0.45); animation: fadeIn 700ms ease both;">

    <h1 style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); margin: 0;">Saptadeep Sharma — Photographer / Filmmaker / Spiritual Scientist / Entrepreneur</h1>

    <a href="{{ instagramUrl }}" target="_blank" rel="noopener" aria-label="Instagram — photos &amp; moments" style="position: absolute; left: 30.566%; top: 45.052%; width: 39.0625%; height: 4.883%; display: block; border-radius: 999px; overflow: hidden; transition: transform 260ms cubic-bezier(.2,.8,.2,1), box-shadow 260ms ease, filter 260ms ease; box-shadow: 0 6px 18px -8px rgba(40,30,22,0.45); animation: riseIn 620ms cubic-bezier(.2,.8,.2,1) 120ms both; will-change: transform;" style-hover="transform: translateY(-3px) scale(1.018); box-shadow: 0 16px 34px -12px rgba(40,30,22,0.55); filter: brightness(1.03);" style-active="transform: translateY(-1px) scale(0.997); box-shadow: 0 6px 14px -8px rgba(40,30,22,0.5);">
      <img src="assets/btn-1.png" alt="Instagram" style="display: block; width: 100%; height: 100%; object-fit: fill;" />
    </a>

    <a href="{{ youtubeUrl }}" target="_blank" rel="noopener" aria-label="YouTube — films &amp; stories" style="position: absolute; left: 30.566%; top: 50.586%; width: 39.0625%; height: 4.883%; display: block; border-radius: 999px; overflow: hidden; transition: transform 260ms cubic-bezier(.2,.8,.2,1), box-shadow 260ms ease, filter 260ms ease; box-shadow: 0 6px 18px -8px rgba(40,30,22,0.45); animation: riseIn 620ms cubic-bezier(.2,.8,.2,1) 210ms both; will-change: transform;" style-hover="transform: translateY(-3px) scale(1.018); box-shadow: 0 16px 34px -12px rgba(40,30,22,0.55); filter: brightness(1.03);" style-active="transform: translateY(-1px) scale(0.997); box-shadow: 0 6px 14px -8px rgba(40,30,22,0.5);">
      <img src="assets/btn-2.png" alt="YouTube" style="display: block; width: 100%; height: 100%; object-fit: fill;" />
    </a>

    <a href="{{ websiteUrl }}" target="_blank" rel="noopener" aria-label="Website — projects &amp; ventures" style="position: absolute; left: 30.566%; top: 56.120%; width: 39.0625%; height: 4.883%; display: block; border-radius: 999px; overflow: hidden; transition: transform 260ms cubic-bezier(.2,.8,.2,1), box-shadow 260ms ease, filter 260ms ease; box-shadow: 0 6px 18px -8px rgba(40,30,22,0.45); animation: riseIn 620ms cubic-bezier(.2,.8,.2,1) 300ms both; will-change: transform;" style-hover="transform: translateY(-3px) scale(1.018); box-shadow: 0 16px 34px -12px rgba(40,30,22,0.55); filter: brightness(1.03);" style-active="transform: translateY(-1px) scale(0.997); box-shadow: 0 6px 14px -8px rgba(40,30,22,0.5);">
      <img src="assets/btn-3.png" alt="Website" style="display: block; width: 100%; height: 100%; object-fit: fill;" />
    </a>

    <a href="{{ emailUrl }}" aria-label="Email — collaborate" style="position: absolute; left: 30.566%; top: 61.654%; width: 39.0625%; height: 4.883%; display: block; border-radius: 999px; overflow: hidden; transition: transform 260ms cubic-bezier(.2,.8,.2,1), box-shadow 260ms ease, filter 260ms ease; box-shadow: 0 6px 18px -8px rgba(40,30,22,0.45); animation: riseIn 620ms cubic-bezier(.2,.8,.2,1) 390ms both; will-change: transform;" style-hover="transform: translateY(-3px) scale(1.018); box-shadow: 0 16px 34px -12px rgba(40,30,22,0.55); filter: brightness(1.03);" style-active="transform: translateY(-1px) scale(0.997); box-shadow: 0 6px 14px -8px rgba(40,30,22,0.5);">
      <img src="assets/btn-4.png" alt="Email" style="display: block; width: 100%; height: 100%; object-fit: fill;" />
    </a>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;instagramUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Links&quot;},&quot;youtubeUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Links&quot;},&quot;websiteUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Links&quot;},&quot;email&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;hello@saptadeepsharma.com&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Links&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const email = p.email ?? "hello@saptadeepsharma.com";
    return {
      instagramUrl: p.instagramUrl ?? "#",
      youtubeUrl: p.youtubeUrl ?? "#",
      websiteUrl: p.websiteUrl ?? "#",
      emailUrl: "mailto:" + email
    };
  }
}
</script>
</body>
</html>
